# This format deliberately excludes client IPs, paths, query strings,
# referrers and user agents while retaining aggregate outage signals.
log_format nova_security '$time_iso8601 $request_method $status $body_bytes_sent $request_time';
map $sent_http_content_type $nova_cache_control {
    default "";
    "~*text/html" "no-store";
}

# Replace certificate paths and root with the production values before enabling.
server {
    listen 443 ssl http2;
    server_name nova-tweaks.com www.nova-tweaks.com;
    access_log /var/log/nginx/nova-tweaks-security.log nova_security buffer=32k flush=5m;
    error_log /var/log/nginx/nova-tweaks-error.log crit;
    server_tokens off;

    root /var/www/nova-tweaks;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/nova-tweaks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nova-tweaks.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $nova_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.nova-tweaks.com; manifest-src 'self'; upgrade-insecure-requests" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # This unversioned bootstrap removes password-reset and verification tokens
    # before the application starts. Never let a stale security bootstrap linger.
    location = /early-url-scrub.js {
        try_files $uri =404;
        expires -1;
        etag off;
    }

    location ~* \.(?:js|css|woff2|png|jpg|jpeg|webp|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
    }
}

server {
    listen 80;
    server_name nova-tweaks.com www.nova-tweaks.com;
    access_log /var/log/nginx/nova-tweaks-security.log nova_security buffer=32k flush=5m;
    error_log /var/log/nginx/nova-tweaks-error.log crit;
    return 301 https://nova-tweaks.com$uri;
}
